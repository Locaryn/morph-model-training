[package]
name = "locaryn-plugin-model-training"
version = "1.1.0"
edition = "2021"
description = "Official Locaryn Extension: Model Fine-Tuning, LoRA Workbench & GGUF Quantization"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-model-training-mcp"
path = "src/bin/model_training_mcp.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[workspace]
